apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow-ingress
  namespace: aceest-fitness
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow-service.aceest-fitness.svc.cluster.local:5000$request_uri"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  ingressClassName: nginx
  rules:
    - host: aceest-shadow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-variant-a
                port:
                  number: 5000