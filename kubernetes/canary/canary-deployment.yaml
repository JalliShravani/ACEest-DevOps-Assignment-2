apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest-fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
    spec:
      containers:
        - name: aceest-fitness
          image: shravanijalli/aceest-fitness:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_PATH
              value: /tmp/aceest-canary.db